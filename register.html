<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Register - Student Hub</title>
<link href="style.css" rel="stylesheet"/>
</head>
<body>
<div class="auth-wrap">
<div class="auth-brand">STUDENT HUB</div>
<div class="auth-title">CREATE ACCOUNT</div>
<form action="#" method="post">
<div class="field field-plain">
<input placeholder="FULL NAME" required="" type="text"/>
</div>
<div class="field field-plain">
<input placeholder="EMAIL" required="" type="email"/>
</div>
<div class="field field-plain">
<input placeholder="PASSWORD" required="" type="password"/>
</div>
<div class="field field-plain">
<input placeholder="CONFIRM PASSWORD" required="" type="password"/>
</div>
<button class="btn btn-outline" style="display:block;margin:20px auto 0;" type="submit">REGISTER</button>
</form>
<div class="auth-switch">
      Already Have Account ? <a href="login.html">LOGIN</a>
</div>
</div>
</body>
</html>
