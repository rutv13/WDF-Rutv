<aside class="sidebar">

<main class="main-content">
<h1 class="page-title">We Value Your Feedback</h1>
<div class="card feedback-form">
<form action="#" method="post">
<label for="subject">Subject</label>
<select class="select-input" id="subject">
<option>Select Subject</option>
<option>Data Structure And Algorithms</option>
<option>Computer Networking</option>
<option>Discrete Mathematics</option>
<option>Web Development Framework</option>
</select>
<label>Rating</label>
<div class="stars">★★★★★</div>
<label for="feedback-text">Your Feedback</label>
<textarea class="feedback-box" id="feedback-text" placeholder="Write your value feedback here ..."></textarea>
<button class="btn btn-outline" style="margin-top:24px;" type="submit">Send Feedback</button>
</form>
</div>
</main>
</div>
