<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Login - Student Hub</title>
<link href="style.css" rel="stylesheet"/>
</head>
<body><nav> <a href="dashboard.html">Dashboard</a></nav>
<div class="auth-wrap">
<div class="auth-brand">STUDENT HUB</div>
<div class="auth-title">LOGIN</div>
<form action="#" method="post">
<div class="field">
<span class="icon">✉</span>
<input placeholder="EMAIL" required="" type="email"/>
</div>
<div class="field">
<span class="icon">🔒</span>
<input placeholder="PASSWORD" required="" type="password"/>
</div>
<a class="forgot-link" href="#">Forgot Password ?</a>
<a href="dashboard.html"><button class="btn btn-outline btn-block" type="submit">LOGIN</button></a>
</form>
<div class="auth-switch">
      Don't have account ? <a href="register.html">REGISTER</a>
</div>
</div>
</body>
</html>
